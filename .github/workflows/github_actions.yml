on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'

name: Build Component Container Images And Submit Metadata To Reliza Hub

jobs:
  # Only build the images whose directory actually changed. Without this a one-line edit
  # anywhere rebuilds all 18 images (~9 min) and drags every unrelated job's flakiness into
  # the result. Pushes to main deliberately ignore the filter and build everything, which is
  # what keeps base images refreshed with upstream patches -- see the `|| main` clause below.
  # Mirrors the detect-job pattern already used in relizaio/rearm.
  detect:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      postgresql_17:         ${{ steps.f.outputs.postgresql_17 }}
      sealed_secrets:        ${{ steps.f.outputs.sealed_secrets }}
      verdaccio:             ${{ steps.f.outputs.verdaccio }}
      kubectl:               ${{ steps.f.outputs.kubectl }}
      maven_postgresql:      ${{ steps.f.outputs.maven_postgresql }}
      jq:                    ${{ steps.f.outputs.jq }}
      awscli:                ${{ steps.f.outputs.awscli }}
      reliza_watcher:        ${{ steps.f.outputs.reliza_watcher }}
      helmpush:              ${{ steps.f.outputs.helmpush }}
      helm_reliza:           ${{ steps.f.outputs.helm_reliza }}
      postgresql_awscli:     ${{ steps.f.outputs.postgresql_awscli }}
      oras_awscli:           ${{ steps.f.outputs.oras_awscli }}
      oci_backups:           ${{ steps.f.outputs.oci_backups }}
      cloud_backups:         ${{ steps.f.outputs.cloud_backups }}
      postgresql_backups:    ${{ steps.f.outputs.postgresql_backups }}
      skopeo_backuper:       ${{ steps.f.outputs.skopeo_backuper }}
      postgres_postgis:      ${{ steps.f.outputs.postgres_postgis }}
      azcopy:                ${{ steps.f.outputs.azcopy }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: f
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            postgresql_17:
              - 'postgresql-17/**'
            sealed_secrets:
              - 'sealed-secrets-controller/**'
            verdaccio:
              - 'verdaccio/**'
            kubectl:
              - 'kubectl/**'
            maven_postgresql:
              - 'maven-postgresql/**'
            jq:
              - 'jq/**'
            awscli:
              - 'awscli/**'
            reliza_watcher:
              - 'reliza-watcher/**'
            helmpush:
              - 'helmpush/**'
            helm_reliza:
              - 'helm-reliza/**'
            postgresql_awscli:
              - 'postgresql-awscli/**'
            oras_awscli:
              - 'oras-awscli/**'
            oci_backups:
              - 'oci-backups/**'
            cloud_backups:
              - 'cloud-backups/**'
            postgresql_backups:
              - 'postgresql-backups/**'
            skopeo_backuper:
              - 'skopeo-backuper/**'
            postgres_postgis:
              - 'postgres-postgis/**'
            azcopy:
              - 'azcopy/**'
  build-postgresql:
    needs: detect
    if: needs.detect.outputs.postgresql_17 == 'true' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    name: Build And Push ReARM PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: RelizaHub Build And Submit ReARM PostgreSQL Release
        uses: relizaio/rearm-docker-action@975e8b3d96b53d56d9c21a34b927b6d7b2a52720 # v1.13.4
        with:
          registry_username: ${{ secrets.RELIZA_LIBRARY_DOCKER_LOGIN }}
          registry_password: ${{ secrets.RELIZA_LIBRARY_DOCKER_TOKEN }}
          registry_host: registry.relizahub.com
          image_namespace: registry.relizahub.com/library
          image_name: rearm-postgres
          rearm_api_id: ${{ secrets.REARM_MAIN_REARM_POSTGRES_API_ID }}
          rearm_api_key: ${{ secrets.REARM_MAIN_REARM_POSTGRES_API_KEY }}
          rearm_api_url: https://reliza.rearmhq.com
          path: postgresql-17/ubuntu-24.04
          rearm_mirror_api_id: ${{ secrets.REARM_REARM_POSTGRES_API_ID }}
          rearm_mirror_api_key: ${{ secrets.REARM_REARM_POSTGRES_API_KEY }}
          rearm_mirror_api_url: https://demo.rearmhq.com
          enable_sbom: true
          source_code_sbom_type: 'none'
          enable_public_cosign_sigstore: 'true'
  build-sealed-secrets-controller:
    needs: detect
    if: needs.detect.outputs.sealed_secrets == 'true' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    name: Build And Push Sealed Secrets Controller
    runs-on: ubuntu-latest
    steps:
      - name: RelizaHub Build And Submit Sealed Secrets Controller Release
        uses: relizaio/reliza-docker-action@a8ba201f314e111885f1ec036e8eeabcb02739be # v3.14
        with:
          registry_username: ${{ secrets.RELIZA_LIBRARY_DOCKER_LOGIN }}
          registry_password: ${{ secrets.RELIZA_LIBRARY_DOCKER_TOKEN }}
          registry_host: registry.relizahub.com
          image_namespace: registry.relizahub.com/library
          image_name: sealed-secrets-controller
          reliza_api_id: ${{ secrets.RELIZA_SECRETS_CONTROLLER_API_ID }}
          reliza_api_key: ${{ secrets.RELIZA_SECRETS_CONTROLLER_API_KEY }}
          path: sealed-secrets-controller/0/debian-13
          push_to_rearm: 'true'
          rearm_api_id: ${{ secrets.REARM_SECRETS_CONTROLLER_API_ID }}
          rearm_api_key: ${{ secrets.REARM_SECRETS_CONTROLLER_API_KEY }}
          source_code_sbom_type: 'none'
          rearm_enable_public_cosign_sigstore: 'true'
  build-reliza-verdaccio:
    needs: detect
    if: needs.detect.outputs.verdaccio == 'true' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    name: Build And Push Reliza Verdaccio
    runs-on: ubuntu-latest
    steps:
      - name: ReARM Build And Submit Reliza Verdaccio Release
        uses: relizaio/rearm-docker-action@975e8b3d96b53d56d9c21a34b927b6d7b2a52720 # v1.13.4
        with:
          registry_username: ${{ secrets.RELIZA_LIBRARY_DOCKER_LOGIN }}
          registry_password: ${{ secrets.RELIZA_LIBRARY_DOCKER_TOKEN }}
          registry_host: registry.relizahub.com
          image_namespace: registry.relizahub.com/library
          image_name: reliza-verdaccio
          rearm_api_id: ${{ secrets.RELIZA_VERDACCIO_API_ID }}
          rearm_api_key: ${{ secrets.RELIZA_VERDACCIO_API_KEY }}
          rearm_api_url: https://reliza.rearmhq.com
          path: verdaccio
          push_to_rearm: 'true'
          rearm_mirror_api_id: ${{ secrets.REARM_RELIZA_VERDACCIO_API_ID }}
          rearm_mirror_api_key: ${{ secrets.REARM_RELIZA_VERDACCIO_API_KEY }}
          rearm_mirror_api_url: https://demo.rearmhq.com
          enable_sbom: true
          source_code_sbom_type: 'npm'
          enable_public_cosign_sigstore: 'true'
  build-reliza-kubectl:
    needs: detect
    if: needs.detect.outputs.kubectl == 'true' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    name: Build And Push Reliza Kubectl
    runs-on: ubuntu-latest
    steps:
      - name: RelizaHub Build And Submit Reliza Kubectl Release
        uses: relizaio/reliza-docker-action@a8ba201f314e111885f1ec036e8eeabcb02739be # v3.14
        with:
          registry_username: ${{ secrets.RELIZA_LIBRARY_DOCKER_LOGIN }}
          registry_password: ${{ secrets.RELIZA_LIBRARY_DOCKER_TOKEN }}
          registry_host: registry.relizahub.com
          image_namespace: registry.relizahub.com/library
          image_name: kubectl
          reliza_api_id: ${{ secrets.RELIZA_KUBECTL_API_ID }}
          reliza_api_key: ${{ secrets.RELIZA_KUBECTL_API_KEY }}
          path: kubectl
          push_to_rearm: 'true'
          rearm_api_id: ${{ secrets.REARM_RELIZA_KUBECTL_API_ID }}
          rearm_api_key: ${{ secrets.REARM_RELIZA_KUBECTL_API_KEY }}
          source_code_sbom_type: 'none'
          rearm_enable_public_cosign_sigstore: 'true'
  build-maven-postgresql:
    needs: detect
    if: needs.detect.outputs.maven_postgresql == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Build and submit release for Maven Postgresql CI
      uses: relizaio/reliza-docker-action@a8ba201f314e111885f1ec036e8eeabcb02739be # v3.14
      with:
        registry_username: ${{ secrets.docker_login }}
        registry_password: ${{ secrets.docker_token }}
        image_namespace: relizaio
        image_name: maven-postgresql
        reliza_api_id: ${{ secrets.RELIZA_MAVEN_POSTGRESQL_API_ID }}
        reliza_api_key: ${{ secrets.RELIZA_MAVEN_POSTGRESQL_API_KEY }}
        path: maven-postgresql
        platform_architectures: 'linux/amd64,linux/arm64'
  build-jq:
    needs: detect
    if: needs.detect.outputs.jq == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Build and submit release for JQ
      uses: relizaio/reliza-docker-action@a8ba201f314e111885f1ec036e8eeabcb02739be # v3.14
      with:
        registry_username: ${{ secrets.docker_login }}
        registry_password: ${{ secrets.docker_token }}
        image_namespace: relizaio
        image_name: jq
        reliza_api_id: ${{ secrets.RELIZA_JQ_API_ID }}
        reliza_api_key: ${{ secrets.RELIZA_JQ_API_KEY }}
        path: jq
        platform_architectures: 'linux/amd64,linux/arm64'
  build-awscli:
    needs: detect
    if: needs.detect.outputs.awscli == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Build and submit release for AWS CLI v1
      uses: relizaio/reliza-docker-action@a8ba201f314e111885f1ec036e8eeabcb02739be # v3.14
      with:
        registry_username: ${{ secrets.docker_login }}
        registry_password: ${{ secrets.docker_token }}
        image_namespace: relizaio
        image_name: awscli
        reliza_api_id: ${{ secrets.RELIZA_AWSCLI_API_ID }}
        reliza_api_key: ${{ secrets.RELIZA_AWSCLI_API_KEY }}
        path: awscli
        platform_architectures: 'linux/amd64,linux/arm64'
  build-reliza-watcher:
    needs: detect
    if: needs.detect.outputs.reliza_watcher == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Build and submit release for kubectl Reliza Watcher image
      uses: relizaio/reliza-docker-action@a8ba201f314e111885f1ec036e8eeabcb02739be # v3.14
      with:
        registry_username: ${{ secrets.docker_login }}
        registry_password: ${{ secrets.docker_token }}
        image_namespace: relizaio
        image_name: reliza-watcher
        reliza_api_id: ${{ secrets.RELIZA_KUBECTL_RELIZA_CLIENT_API_ID }}
        reliza_api_key: ${{ secrets.RELIZA_KUBECTL_RELIZA_CLIENT_API_KEY }}
        path: reliza-watcher
        platform_architectures: 'linux/amd64,linux/arm64'
  build-helmpush:
    needs: detect
    if: needs.detect.outputs.helmpush == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Build and submit release for Reliza Helm Push image
      uses: relizaio/reliza-docker-action@a8ba201f314e111885f1ec036e8eeabcb02739be # v3.14
      with:
        registry_username: ${{ secrets.docker_login }}
        registry_password: ${{ secrets.docker_token }}
        image_namespace: relizaio
        image_name: helmpush
        reliza_api_id: ${{ secrets.RELIZA_HELM_PUSH_API_ID }}
        reliza_api_key: ${{ secrets.RELIZA_HELM_PUSH_API_KEY }}
        path: helmpush
        platform_architectures: 'linux/amd64,linux/arm64'
  build-helm-reliza-cli:
    needs: detect
    if: needs.detect.outputs.helm_reliza == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Build and submit release for Helm and Reliza CLI image
      uses: relizaio/reliza-docker-action@a8ba201f314e111885f1ec036e8eeabcb02739be # v3.14
      with:
        registry_username: ${{ secrets.docker_login }}
        registry_password: ${{ secrets.docker_token }}
        image_namespace: relizaio
        image_name: helm-reliza-cli
        reliza_api_id: ${{ secrets.RELIZA_HELM_RELIZA_CLI_API_ID }}
        reliza_api_key: ${{ secrets.RELIZA_HELM_RELIZA_CLI_API_KEY }}
        path: helm-reliza
        platform_architectures: 'linux/amd64,linux/arm64'
  build-psql-awscli:
    needs: detect
    if: needs.detect.outputs.postgresql_awscli == 'true' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Build and submit release for PostgreSQL AWS CLI
        uses: relizaio/rearm-docker-action@975e8b3d96b53d56d9c21a34b927b6d7b2a52720 # v1.13.4
        with:
          registry_username: ${{ secrets.RELIZA_LIBRARY_DOCKER_LOGIN }}
          registry_password: ${{ secrets.RELIZA_LIBRARY_DOCKER_TOKEN }}
          registry_host: registry.relizahub.com
          image_namespace: registry.relizahub.com/library
          image_name: psql-awscli
          rearm_api_id: ${{ secrets.RELIZA_POSTGRESQL_AWSCLI_API_ID }}
          rearm_api_key: ${{ secrets.RELIZA_POSTGRESQL_AWSCLI_API_KEY }}
          rearm_api_url: https://reliza.rearmhq.com
          path: postgresql-awscli
          platform_architectures: 'linux/amd64'
          enable_sbom: true
          source_code_sbom_type: 'none'
          enable_public_cosign_sigstore: 'true'
          push_to_rearm_mirror: 'true'
          rearm_mirror_api_id: ${{ secrets.REARM_POSTGRESQL_AWSCLI_API_ID }}
          rearm_mirror_api_key: ${{ secrets.REARM_POSTGRESQL_AWSCLI_API_KEY }}
          rearm_mirror_api_url: https://demo.rearmhq.com
  build-oras-awscli:
    needs: detect
    if: needs.detect.outputs.oras_awscli == 'true' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Build and submit release for ORAS AWS CLI
        uses: relizaio/rearm-docker-action@975e8b3d96b53d56d9c21a34b927b6d7b2a52720 # v1.13.4
        with:
          registry_username: ${{ secrets.RELIZA_LIBRARY_DOCKER_LOGIN }}
          registry_password: ${{ secrets.RELIZA_LIBRARY_DOCKER_TOKEN }}
          registry_host: registry.relizahub.com
          image_namespace: registry.relizahub.com/library
          image_name: oras-awscli
          rearm_api_id: ${{ secrets.RELIZA_ORAS_AWSCLI_API_ID }}
          rearm_api_key: ${{ secrets.RELIZA_ORAS_AWSCLI_API_KEY }}
          rearm_api_url: https://reliza.rearmhq.com
          path: oras-awscli
          platform_architectures: 'linux/amd64'
          source_code_sbom_type: 'none'
          enable_public_cosign_sigstore: 'true'
          push_to_rearm_mirror: 'true'
          rearm_mirror_api_id: ${{ secrets.REARM_ORAS_AWSCLI_API_ID }}
          rearm_mirror_api_key: ${{ secrets.REARM_ORAS_AWSCLI_API_KEY }}
          rearm_mirror_api_url: https://demo.rearmhq.com
  build-oci-backups:
    needs: detect
    if: needs.detect.outputs.oci_backups == 'true' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Build and submit release for OCI Backups
        uses: relizaio/rearm-docker-action@975e8b3d96b53d56d9c21a34b927b6d7b2a52720 # v1.13.4
        with:
          registry_username: ${{ secrets.RELIZA_LIBRARY_DOCKER_LOGIN }}
          registry_password: ${{ secrets.RELIZA_LIBRARY_DOCKER_TOKEN }}
          registry_host: registry.relizahub.com
          image_namespace: registry.relizahub.com/library
          image_name: oci-backups
          rearm_api_id: ${{ secrets.RELIZA_OCI_BACKUPS_API_ID }}
          rearm_api_key: ${{ secrets.RELIZA_OCI_BACKUPS_API_KEY }}
          rearm_api_url: https://reliza.rearmhq.com
          path: oci-backups
          platform_architectures: 'linux/amd64'
          enable_public_cosign_sigstore: 'true'
          push_to_rearm_mirror: 'true'
          rearm_mirror_api_id: ${{ secrets.REARM_OCI_BACKUPS_API_ID }}
          rearm_mirror_api_key: ${{ secrets.REARM_OCI_BACKUPS_API_KEY }}
          rearm_mirror_api_url: https://demo.rearmhq.com
          enable_sbom: true
          source_code_sbom_type: go
  build-cloud-backups:
    needs: detect
    if: needs.detect.outputs.cloud_backups == 'true' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Build and submit release for Cloud Backups
        uses: relizaio/rearm-docker-action@975e8b3d96b53d56d9c21a34b927b6d7b2a52720 # v1.13.4
        with:
          registry_username: ${{ secrets.RELIZA_LIBRARY_DOCKER_LOGIN }}
          registry_password: ${{ secrets.RELIZA_LIBRARY_DOCKER_TOKEN }}
          registry_host: registry.relizahub.com
          image_namespace: registry.relizahub.com/library
          image_name: cloud-backup
          rearm_api_id: ${{ secrets.RELIZA_CLOUD_BACKUP_API_ID }}
          rearm_api_key: ${{ secrets.RELIZA_CLOUD_BACKUP_API_KEY }}
          rearm_api_url: https://reliza.rearmhq.com
          path: cloud-backups
          platform_architectures: 'linux/amd64'
          enable_public_cosign_sigstore: 'true'
          push_to_rearm_mirror: 'true'
          rearm_mirror_api_id: ${{ secrets.REARM_CLOUD_BACKUP_API_ID }}
          rearm_mirror_api_key: ${{ secrets.REARM_CLOUD_BACKUP_API_KEY }}
          rearm_mirror_api_url: https://demo.rearmhq.com
          enable_sbom: true
          source_code_sbom_type: go
  build-postgresql-backups:
    needs: detect
    if: needs.detect.outputs.postgresql_backups == 'true' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Build and submit release for POSTGRESQL Backups
        uses: relizaio/rearm-docker-action@975e8b3d96b53d56d9c21a34b927b6d7b2a52720 # v1.13.4
        with:
          registry_username: ${{ secrets.RELIZA_LIBRARY_DOCKER_LOGIN }}
          registry_password: ${{ secrets.RELIZA_LIBRARY_DOCKER_TOKEN }}
          registry_host: registry.relizahub.com
          image_namespace: registry.relizahub.com/library
          image_name: postgresql-backups
          rearm_api_id: ${{ secrets.RELIZA_POSTGRESQL_BACKUPS_API_ID }}
          rearm_api_key: ${{ secrets.RELIZA_POSTGRESQL_BACKUPS_API_KEY }}
          rearm_api_url: https://reliza.rearmhq.com
          path: postgresql-backups
          platform_architectures: 'linux/amd64'
          enable_public_cosign_sigstore: 'true'
          push_to_rearm_mirror: 'true'
          rearm_mirror_api_id: ${{ secrets.REARM_POSTGRESQL_BACKUPS_API_ID }}
          rearm_mirror_api_key: ${{ secrets.REARM_POSTGRESQL_BACKUPS_API_KEY }}
          rearm_mirror_api_url: https://demo.rearmhq.com
          enable_sbom: true
          source_code_sbom_type: go

  build-skopeo-backuper:
    needs: detect
    if: needs.detect.outputs.skopeo_backuper == 'true' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Build and submit release for Skopeo Backuper
        uses: relizaio/rearm-docker-action@975e8b3d96b53d56d9c21a34b927b6d7b2a52720 # v1.13.4
        with:
          registry_username: ${{ secrets.RELIZA_LIBRARY_DOCKER_LOGIN }}
          registry_password: ${{ secrets.RELIZA_LIBRARY_DOCKER_TOKEN }}
          registry_host: registry.relizahub.com
          image_namespace: registry.relizahub.com/library
          image_name: skopeo-backuper
          rearm_api_id: ${{ secrets.RELIZA_SKOPEO_BACKUPER_API_ID }}
          rearm_api_key: ${{ secrets.RELIZA_SKOPEO_BACKUPER_API_KEY }}
          rearm_api_url: https://reliza.rearmhq.com
          path: skopeo-backuper
          platform_architectures: 'linux/amd64'
          enable_public_cosign_sigstore: 'true'
          enable_sbom: true
          source_code_sbom_type: none
  build-postgres-postgis:
    needs: detect
    if: needs.detect.outputs.postgres_postgis == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Build and submit release for PostgreSQL Postgis
      uses: relizaio/reliza-docker-action@a8ba201f314e111885f1ec036e8eeabcb02739be # v3.14
      with:
        registry_username: ${{ secrets.docker_login }}
        registry_password: ${{ secrets.docker_token }}
        image_namespace: relizaio
        image_name: postgres-postgis
        reliza_api_id: ${{ secrets.RELIZA_POSTGRESQL_POSTGIS_API_ID }}
        reliza_api_key: ${{ secrets.RELIZA_POSTGRESQL_POSTGIS_API_KEY }}
        path: postgres-postgis
        platform_architectures: 'linux/amd64,linux/arm64'
  build-azcopy:
    needs: detect
    if: needs.detect.outputs.azcopy == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Build and submit release for azcopy
      uses: relizaio/reliza-docker-action@a8ba201f314e111885f1ec036e8eeabcb02739be # v3.14
      with:
        registry_username: ${{ secrets.docker_login }}
        registry_password: ${{ secrets.docker_token }}
        image_namespace: relizaio
        image_name: azcopy
        reliza_api_id: ${{ secrets.RELIZA_AZCOPY_API_ID }}
        reliza_api_key: ${{ secrets.RELIZA_AZCOPY_API_KEY }}
        path: azcopy
        platform_architectures: 'linux/amd64,linux/arm64'
